name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch
        # The default torch wheel bundles CUDA (~2.5 GB) and would time out here.
        # GitHub runners have no GPU, so the CPU build is both correct and much faster.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v
